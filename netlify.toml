# Web version of AskDB (the desktop app is built separately with `npm run dist`).
[build]
  command = "node web/build.js"
  publish = "web/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Bundle pg into the function; pg-native is an optional add-on we don't use.
  external_node_modules = ["pg-native"]

[build.environment]
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
