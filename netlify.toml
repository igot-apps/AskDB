# Web version of AskDB (the desktop app is built separately with `npm run dist`).
[build]
  command = "node web/build.js"
  publish = "web/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pg"]

[build.environment]
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
