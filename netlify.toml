# Web version of AskDB (the desktop app is built separately with `npm run dist`).
[build]
  command = "node web/build.js"
  publish = "web/dist"

[functions]
  # Pre-bundled by web/build.js (source: netlify/functions/db.mjs).
  directory = ".netlify-functions"

[[redirects]]
  from = "/api/db"
  to = "/.netlify/functions/db"
  status = 200
  force = true

[build.environment]
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
